###############################################################################
# Polymarket 5m BTC/ETH TWAP paper bot
###############################################################################

[GENERAL]
ASSETS = "BTC,ETH"
WINDOW_SEC = 300
TWAP_WINDOW_S = 60

[FEED]
RTDS_URL = "wss://ws-live-data.polymarket.com"
CLOB_WS_URL = "wss://ws-subscriptions-clob.polymarket.com/ws/market"
GAMMA_API = "https://gamma-api.polymarket.com"
CLOB_API = "https://clob.polymarket.com"
PRICE_BUFFER_S = 900
RECONNECT_BASE_S = 1.0
RECONNECT_MAX_S = 30.0

[WEB]
# 127.0.0.1 is safe by default. To expose the dashboard set HOST="0.0.0.0"
# and a non-empty PASSWORD (HTTP Basic auth).
HOST = "127.0.0.1"
PORT = 8036
USERNAME = "admin"
PASSWORD = ""
SESSION_TTL_S = 604800

[EXECUTION]
# Global live gates. Per-asset paper/live mode is saved from the config page
# (strategy param TRADING_MODE, persisted in SQLite), but it only takes effect
# when LIVE_ENABLED=true AND PAPER_TRADING=false.
PAPER_TRADING = true
LIVE_ENABLED = false

[STRATEGY]
# Global defaults. Fields in src.config.COMMON_PARAM_FIELDS (fee, sigma,
# engine tick, signal logging, book freshness, min order size, maker shadow)
# are always read from this table, even when an asset has its own override.
# The config page edits them in the shared "通用设置" card.
# Entry requires: fair - executable_ask - fee >= MIN_EDGE + MODEL_BUFFER
MIN_EDGE = 0.05
MODEL_BUFFER = 0.02
# Optional side-level gates (0 = off). MIN_FAIR drops sides whose model
# probability is too low; MIN_ENTRY_PRICE drops sides whose all-in entry price
# is too cheap (the market disagrees with an overconfident model).
MIN_FAIR = 0.0
MIN_ENTRY_PRICE = 0.0
MAX_POSITION_USD = 5.0
DAILY_LOSS_LIMIT_USD = 20.0
ENTRY_MIN_REL_S = 60
ENTRY_MAX_REL_S = 285
MAX_SPREAD = 0.03
MAX_STALE_BOOK_S = 3.0
MIN_ASK_SHARES = 5.0
MIN_ORDER_SHARES = 5.0
TAKER_FEE_RATE = 0.07
SIGMA_LOOKBACK_S = 600
MIN_SIGMA_SAMPLES = 120
ENGINE_TICK_S = 0.5
SIGNAL_LOG_MIN_EDGE = 0.02

# Maker shadow: simulate a maker-first entry next to the real taker paper
# fill. It only writes comparison stats; it never changes paper execution.
MAKER_SHADOW_ENABLED = true
MAKER_BUFFER = 0.01
MAKER_FALLBACK_REL_S = 250
MAKER_CHASE_BID = true

# ── Per-asset defaults ──────────────────────────────────────────────────
# Partial overrides merged over [STRATEGY]. Fields not listed inherit the
# current global value; the dashboard can still save a per-asset override on
# top of these (stored in SQLite). Only per-coin fields belong here: common
# fields (see COMMON_PARAM_FIELDS) are ignored in a per-asset table.
[STRATEGY.BTC]
# Paper results (Berlin 29 + Dublin 14 settled positions, 2026-11-06):
# all live entries were at rel 60-120s, while the backtest's edge lives at
# 180-270s; fair≈0.5 tickets lost most; BTC's model was overconfident
# (22 trades, 45% wins vs 0.71 average fair).
ENTRY_MIN_REL_S = 180
ENTRY_MAX_REL_S = 270
# General recommendation is 0.04; BTC gets one extra notch.
MODEL_BUFFER = 0.05
# Skip lottery tickets: fair 0.55-0.65 won only 46%, and entries below 0.50
# won 10%. Both are independently tunable from the config page.
MIN_FAIR = 0.65
MIN_ENTRY_PRICE = 0.55
